name: Recontact safeguards
on:
  pull_request:
  push:
    branches: ["aside/recontact-safety-*"]
permissions:
  contents: read
concurrency:
  group: recontact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Recontact changed-file lint
        run: npx eslint components/RecontactPanel.tsx components/SmsAppLink.tsx lib/recontacts.ts lib/recontactRules.ts lib/types.ts lib/recontactRules.test.ts lib/recontacts.test.ts
      - name: Isolated PostgreSQL permissions and RPC checks
        run: |
          npm install --prefix "$RUNNER_TEMP/recontact-db" --no-save --ignore-scripts @electric-sql/pglite@0.5.16
          PGLITE_MODULE="file://$RUNNER_TEMP/recontact-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-recontact-db.mjs
